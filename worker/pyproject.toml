[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "accompaniment-worker"
version = "0.1.0"
description = "Controlled single-file accompaniment inference worker"
requires-python = ">=3.11,<3.12"
dependencies = [
  "PyYAML>=6.0,<7",
  "soundfile>=0.13,<1",
]

[project.scripts]
accompaniment-worker = "accompaniment_worker.cli:main"

[project.optional-dependencies]
cuda = [
  "beartype>=0.22,<1",
  "einops>=0.8,<1",
  "librosa>=0.11,<1",
  "numpy>=2,<3",
  "packaging>=24,<27",
  "rotary-embedding-torch>=0.8,<1",
  "torch==2.6.0",
  "torchaudio==2.6.0",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.uv]
environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", extra = "cuda" }]
torchaudio = [{ index = "pytorch-cu124", extra = "cuda" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/accompaniment_worker"]

[tool.hatch.build.targets.wheel.force-include]
"src/accompaniment_worker/resources/kimberley-melbandroformer.yaml" = "accompaniment_worker/resources/kimberley-melbandroformer.yaml"
"vendor" = "accompaniment_worker/vendor"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
