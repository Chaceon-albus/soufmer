[package]
name = "soufmer"
version = "0.1.0"
description = "Music accompaniment extraction desktop application"
authors = ["Soufmer contributors"]
edition = "2024"

[lib]
name = "soufmer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "soufmer"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tauri = { version = "2" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Registry and MessageBox APIs implement the native WebView2 prerequisite check before Tauri starts.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
